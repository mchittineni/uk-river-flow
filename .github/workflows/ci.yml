name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Confirm the pipeline has no third-party dependencies
        run: |
          if [ -s pipeline/requirements.txt ]; then
            echo "::error::pipeline/requirements.txt is non-empty; the ingest is meant to be stdlib-only"
            exit 1
          fi
          PYTHONPATH=pipeline python3 -c "
          import riverflow, riverflow.contract, riverflow.geometry, riverflow.http, riverflow.series
          print('stdlib-only import OK:', riverflow.__version__)
          "

      - name: Unit tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: Validate the committed seed bundle
        run: python3 pipeline/validate_data.py --root data/v1 --allow-missing

      - name: Confirm validation does not mutate the bundle
        run: |
          git diff --exit-code -- data/ || {
            echo "::error::validation mutated data/; it must be read-only"
            exit 1
          }

  web:
    name: Front end
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Update Dependencies
        run: npm ci
        working-directory: web

      - name: Check Code Formatting
        run: npm run format:check
        working-directory: web

      - name: Lint Code
        run: npm run lint
        working-directory: web

      - name: Unit tests
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Verify Security Headers
        run: npm run check:headers
        working-directory: web

      - name: Enforce the page-weight budget
        run: |
          BUDGET_KB=1200
          TOTAL=$(find web/dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 -r gzip -c | wc -c)
          TOTAL_KB=$((TOTAL / 1024))
          echo "gzipped app assets: ${TOTAL_KB} KB (budget ${BUDGET_KB} KB)"
          if [ "$TOTAL_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::bundle is ${TOTAL_KB} KB gzipped, over the ${BUDGET_KB} KB budget"
            exit 1
          fi

      - name: Upload Site Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-preview
          path: web/dist
          retention-days: 7
