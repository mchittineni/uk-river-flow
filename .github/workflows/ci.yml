name: CI

# Runs on every push and pull request. Deliberately does no network I/O: the
# upstream APIs are free public services and a CI job that hits them on every
# commit is both rude and flaky. Live fetching happens only in the scheduled
# ingest, which runs once per source per schedule.
#
# Security note: no step interpolates attacker-controllable event data
# (issue/PR titles, branch names, commit messages) into a shell. The only
# expressions used are `github.ref` in the concurrency key and `matrix.python`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref. Free minutes are unlimited on public
# repos, but a queue of stale runs still delays the one you care about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the oldest version the code's syntax supports; the ceiling
        # catches deprecations before a runner image upgrade does it for us.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Confirm the pipeline has no third-party dependencies
        # A design property worth enforcing, not just documenting: the ingest must
        # run on a bare interpreter so a fork years from now is never blocked by an
        # unresolvable lockfile.
        run: |
          if [ -s pipeline/requirements.txt ]; then
            echo "::error::pipeline/requirements.txt is non-empty; the ingest is meant to be stdlib-only"
            exit 1
          fi
          PYTHONPATH=pipeline python3 -c "
          import riverflow, riverflow.contract, riverflow.geometry, riverflow.http, riverflow.series
          print('stdlib-only import OK:', riverflow.__version__)
          "

      - name: Unit tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: Validate the committed seed bundle
        # `--allow-missing` covers the bootstrap case: a fresh fork has no seed until
        # the first scheduled ingest opens its PR, and failing CI for that would block
        # the very change that fixes it. Once a seed exists, this validates it strictly.
        run: python3 pipeline/validate_data.py --root data/v1 --allow-missing

      - name: Confirm validation does not mutate the bundle
        # The scheduled ingest relies on identical data producing an identical file.
        # If validation itself wrote anything, every run would churn a diff.
        run: |
          git diff --exit-code -- data/ || {
            echo "::error::validation mutated data/; it must be read-only"
            exit 1
          }

  web:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run format:check
        working-directory: web

      - run: npm run lint
        working-directory: web

      - name: Unit tests
        # Includes the parity check asserting the JS and Python implementations of
        # `flowState` agree; duplicated logic is only safe if something watches it.
        run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

      - name: Enforce the page-weight budget
        # A map that takes ten seconds to paint is a broken map. Checked in CI so a
        # dependency bump cannot quietly blow it.
        run: |
          BUDGET_KB=1200
          TOTAL=$(find web/dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 -r gzip -c | wc -c)
          TOTAL_KB=$((TOTAL / 1024))
          echo "gzipped app assets: ${TOTAL_KB} KB (budget ${BUDGET_KB} KB)"
          if [ "$TOTAL_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::bundle is ${TOTAL_KB} KB gzipped, over the ${BUDGET_KB} KB budget"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: web/dist
          retention-days: 7
