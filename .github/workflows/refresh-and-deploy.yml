name: Refresh data and deploy

on:
  schedule:
    - cron: "20 5,11,17 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history in the published window"
        type: number
        default: 30
      refresh_reference:
        description: "Also recompute the long-run percentile reference (slow)"
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Ingest, validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Fetch Environment Agency data
        env:
          DAYS: ${{ inputs.days || 30 }}
          REFRESH_REFERENCE: ${{ inputs.refresh_reference || false }}
        run: |
          set -euo pipefail
          args=(--days "$DAYS" --out data/v1)
          if [ "$REFRESH_REFERENCE" = "true" ]; then
            args+=(--reference)
          fi
          python3 pipeline/ingest_uk.py "${args[@]}"

      - name: Validate against the published contract
        run: python3 pipeline/validate_data.py --root data/v1

      - name: Guard against a collapse in station count
        run: |
          set -euo pipefail
          if ! git show "HEAD:data/v1/stations.json" > /tmp/committed-stations.json 2>/dev/null; then
            echo "::notice::no committed bundle to compare against - treating this as a bootstrap run"
            exit 0
          fi
          python3 - <<'EOF'
          import json, pathlib, sys

          fresh = json.loads(pathlib.Path("data/v1/stations.json").read_text())
          known = json.loads(pathlib.Path("/tmp/committed-stations.json").read_text())
          floor = int(len(known) * 0.7)
          print(f"fresh={len(fresh)} committed={len(known)} floor={floor}")
          if len(fresh) < floor:
              print(f"::error::only {len(fresh)} stations, under 70% of the committed {len(known)}")
              sys.exit(1)
          EOF

      - name: Summarise
        run: |
          set -euo pipefail
          {
            echo "### Data refresh"
            echo ""
            echo '```'
            python3 pipeline/validate_data.py --root data/v1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Confirm the build still ships its security headers
        run: npm run check:headers
        working-directory: web

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
      
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
